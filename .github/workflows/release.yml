name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-signature.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Verify tag provenance
        run: scripts/check-release-provenance.sh "$GITHUB_SHA" origin/main
      - name: Verify tag and package metadata
        id: release
        run: scripts/check-release.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify publishable package
        run: cargo package --locked

  required-checks:
    name: Required release checks
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish treetop-client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, required-checks]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ needs.verify.outputs.release-version }}
        run: |
          status="$(curl --silent --user-agent 'treetop-client-release-workflow' \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/treetop-client/${VERSION}")"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected crates.io response: HTTP ${status}" >&2; exit 1 ;;
          esac

      - name: Detect first-release bootstrap credential
        if: steps.published.outputs.exists != 'true'
        id: bootstrap
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$CRATES_IO_BOOTSTRAP_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io trusted publishing
        if: steps.published.outputs.exists != 'true' && steps.bootstrap.outputs.available != 'true'
        id: trusted-publishing
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.published.outputs.exists != 'true'
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          OIDC_TOKEN: ${{ steps.trusted-publishing.outputs.token }}
        run: |
          token="${CRATES_IO_BOOTSTRAP_TOKEN:-${OIDC_TOKEN}}"
          if [ -z "$token" ]; then
            echo "No crates.io credential is available. See RELEASING.md for first-release bootstrap instructions." >&2
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="$token" cargo publish --locked

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, publish]
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.release-tag }}
          name: ${{ needs.verify.outputs.release-tag }}
          generate_release_notes: true
          make_latest: true
