[package]
name = "treetop-client-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
treetop-client = { path = ".." }

[[bin]]
name = "deserialize"
path = "fuzz_targets/deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "urls"
path = "fuzz_targets/urls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nested_context"
path = "fuzz_targets/nested_context.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_consistency"
path = "fuzz_targets/response_consistency.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
